[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "HebrewYemama"
version = "1.0"
description = "Halakhic day-division times (yemama), clock rendering, and custom day-definitions"
readme = { text = "Halakhic day-division times (yemama), clock rendering, and custom day-definitions.", content-type = "text/plain" }
requires-python = ">=3.8"
dependencies = [
    "Date",
    "Astro",
    "HebrewDate",
    "Pillow",
]

[tool.setuptools]
py-modules = ["HebrewYemama", "Clock", "Display", "Custom"]
